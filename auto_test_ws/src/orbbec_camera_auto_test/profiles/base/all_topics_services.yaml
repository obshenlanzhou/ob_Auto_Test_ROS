# Canonical Orbbec interface catalog. The generic functional runner loads this
# file directly; runtime discovery decides which advertised interfaces are tested.
profile_name: generic_functional
launch_file: ""

default_launch_args:
  camera_name: camera

launch_scenarios:
  - name: default
    launch_args: {}
    topic_defaults:
      timeout: 10
    topics:
      # Color topics
      - name: /{camera}/color/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/color/image_raw
      - name: /{camera}/color/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/color/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/color/image_raw/theora
        type: ""
        mode: advertised
      - name: /{camera}/color/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata

      # Depth topics
      - name: /{camera}/depth/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/depth/image_raw
      - name: /{camera}/depth/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/depth/image_raw/compressedDepth
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/depth/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata
      - name: /{camera}/depth/points
        type: sensor_msgs/msg/PointCloud2
        mode: message
        validator: point_cloud
      - name: /{camera}/depth_registered/points
        type: sensor_msgs/msg/PointCloud2
        mode: message
        validator: point_cloud

      # Infrared topics
      - name: /{camera}/ir/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/ir/image_raw
      - name: /{camera}/ir/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/ir/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/ir/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata
      - name: /{camera}/left_ir/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/left_ir/image_raw
      - name: /{camera}/left_ir/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/left_ir/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/left_ir/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata
      - name: /{camera}/right_ir/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/right_ir/image_raw
      - name: /{camera}/right_ir/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/right_ir/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/right_ir/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata

      # Dual-color topics
      - name: /{camera}/left_color/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/left_color/image_raw
      - name: /{camera}/left_color/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/left_color/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/left_color/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata
      - name: /{camera}/right_color/camera_info
        type: sensor_msgs/msg/CameraInfo
        mode: message
        validator: camera_info_matches_image
        paired_topic: /{camera}/right_color/image_raw
      - name: /{camera}/right_color/image_raw
        type: sensor_msgs/msg/Image
        mode: message
        validator: image
      - name: /{camera}/right_color/image_raw/compressed
        type: sensor_msgs/msg/CompressedImage
        mode: advertised
      - name: /{camera}/right_color/metadata
        type: orbbec_camera_msgs/msg/Metadata
        mode: message
        validator: metadata

      # IMU topics
      - name: /{camera}/accel/sample
        type: sensor_msgs/msg/Imu
        mode: message
        validator: imu
      - name: /{camera}/accel/imu_info
        type: orbbec_camera_msgs/msg/IMUInfo
        mode: message
        validator: any
      - name: /{camera}/gyro/sample
        type: sensor_msgs/msg/Imu
        mode: message
        validator: imu
      - name: /{camera}/gyro/imu_info
        type: orbbec_camera_msgs/msg/IMUInfo
        mode: message
        validator: any
      - name: /{camera}/gyro_accel/sample
        type: sensor_msgs/msg/Imu
        mode: message
        validator: imu

      # Extrinsics and device-state topics
      - name: /{camera}/depth_to_ir
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_to_color
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_to_left_ir
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_to_right_ir
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_to_accel
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_to_gyro
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/left_color_to_right_color
        type: orbbec_camera_msgs/msg/Extrinsics
        mode: message
        validator: extrinsics
        qos: transient_local
      - name: /{camera}/depth_filters/status
        type: orbbec_camera_msgs/msg/DepthFiltersStatus
        mode: message
        validator: any
        qos: transient_local
      - name: /{camera}/lrm/obstacle_distance
        type: std_msgs/msg/Int32
        mode: message
        validator: any

      - name: /{camera}/device_status
        type: orbbec_camera_msgs/msg/DeviceStatus
        mode: message
        validator: device_status
      - name: /diagnostics
        type: diagnostic_msgs/msg/DiagnosticArray
        mode: advertised
      - name: /tf
        type: tf2_msgs/msg/TFMessage
        mode: advertised
      - name: /tf_static
        type: tf2_msgs/msg/TFMessage
        mode: message
        validator: tf_static
        qos: transient_local
    services:
      # Read-only services
      # Color / white balance
      - name: /{camera}/get_auto_white_balance
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_color_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_color_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_white_balance
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true

      # Depth
      - name: /{camera}/get_depth_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_depth_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true

      # Device / status / system
      - name: /{camera}/get_device_info
        type: orbbec_camera_msgs/srv/GetDeviceInfo
        mode: read
        response_checks:
          - success_true
          - field_non_empty:info.name
          - field_non_empty:info.serial_number
      - name: /{camera}/get_device_config
        type: orbbec_camera_msgs/srv/GetDeviceConfig
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_laser_status
        type: orbbec_camera_msgs/srv/GetBool
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_ldp_status
        type: orbbec_camera_msgs/srv/GetBool
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_lrm_measure_distance
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_point_cloud_decimation
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_ptp_config
        type: orbbec_camera_msgs/srv/GetBool
        mode: read
        response_checks:
          - success_true
      - name: /{camera}/get_sdk_version
        type: orbbec_camera_msgs/srv/GetString
        mode: read
        response_checks:
          - success_true
          - field_non_empty:data
      - name: /{camera}/get_streams_enable
        type: orbbec_camera_msgs/srv/GetBool
        mode: read
        response_checks:
          - success_true

      # Roundtrip services
      # Color / white balance
      - name: /{camera}/set_auto_white_balance
        type: std_srvs/srv/SetBool
        mode: roundtrip_bool_int
        getter_name: /{camera}/get_auto_white_balance
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        wait_after_call: 2.0
      - name: /{camera}/set_color_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int
        getter_name: /{camera}/get_color_exposure
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 30
        alternate_request:
          data: 60
        wait_after_call: 2.0
      - name: /{camera}/set_color_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int
        getter_name: /{camera}/get_color_gain
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 16
        alternate_request:
          data: 32
        wait_after_call: 2.0
      - name: /{camera}/set_white_balance
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int_auto_white_balance_off
        getter_name: /{camera}/get_white_balance
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 3000
        alternate_request:
          data: 3500
        wait_after_call: 2.0

      # Depth
      - name: /{camera}/set_depth_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int
        getter_name: /{camera}/get_depth_exposure
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 3000
        alternate_request:
          data: 4000
        wait_after_call: 2.0
      - name: /{camera}/set_depth_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int
        getter_name: /{camera}/get_depth_gain
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 16
        alternate_request:
          data: 32
        wait_after_call: 2.0

      # Device / status / system
      - name: /{camera}/set_laser_enable
        type: std_srvs/srv/SetBool
        mode: roundtrip_bool
        getter_name: /{camera}/get_laser_status
        getter_type: orbbec_camera_msgs/srv/GetBool
        getter_field: data
        request_field: data
        wait_after_call: 2.0
      - name: /{camera}/set_ldp_enable
        type: std_srvs/srv/SetBool
        mode: roundtrip_bool
        getter_name: /{camera}/get_ldp_status
        getter_type: orbbec_camera_msgs/srv/GetBool
        getter_field: data
        request_field: data
        wait_after_call: 2.0
      - name: /{camera}/set_point_cloud_decimation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: roundtrip_int
        getter_name: /{camera}/get_point_cloud_decimation
        getter_type: orbbec_camera_msgs/srv/GetInt32
        getter_field: data
        request_field: data
        request:
          data: 2
        alternate_request:
          data: 1
        wait_after_call: 2.0
      - name: /{camera}/set_ptp_config
        type: std_srvs/srv/SetBool
        mode: roundtrip_bool
        getter_name: /{camera}/get_ptp_config
        getter_type: orbbec_camera_msgs/srv/GetBool
        getter_field: data
        request_field: data
        wait_after_call: 2.0
      - name: /{camera}/set_streams_enable
        type: std_srvs/srv/SetBool
        mode: roundtrip_bool
        getter_name: /{camera}/get_streams_enable
        getter_type: orbbec_camera_msgs/srv/GetBool
        getter_field: data
        request_field: data
        wait_after_call: 2.0

      # Advertised setter services
      # Color
      - name: /{camera}/send_software_trigger
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_ae_mode
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/set_ae_reference_stream
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/set_ae_strategy
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/set_color_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_color_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_color_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_color_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_color_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised

      # Depth
      - name: /{camera}/set_depth_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_depth_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_depth_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_depth_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_depth_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_disparity_range_mode
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_disparity_search_offset
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised

      # Generic IR stream controls
      - name: /{camera}/get_ir_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/get_ir_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/set_ir_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_ir_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_ir_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_ir_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_ir_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_ir_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_ir_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/toggle_ir
        type: std_srvs/srv/SetBool
        mode: advertised

      # Left IR stream controls
      - name: /{camera}/get_left_ir_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/get_left_ir_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/set_left_ir_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_left_ir_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_left_ir_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_left_ir_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_ir_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_ir_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_ir_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/toggle_left_ir
        type: std_srvs/srv/SetBool
        mode: advertised

      # Right IR stream controls
      - name: /{camera}/get_right_ir_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/get_right_ir_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/set_right_ir_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_right_ir_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_right_ir_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_right_ir_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_ir_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_ir_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_ir_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/toggle_right_ir
        type: std_srvs/srv/SetBool
        mode: advertised

      # Left color stream controls
      - name: /{camera}/get_left_color_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/get_left_color_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/set_left_color_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_left_color_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_left_color_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_left_color_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_color_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_color_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_left_color_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/toggle_left_color
        type: std_srvs/srv/SetBool
        mode: advertised

      # Right color stream controls
      - name: /{camera}/get_right_color_exposure
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/get_right_color_gain
        type: orbbec_camera_msgs/srv/GetInt32
        mode: read
        response_checks: [success_true]
      - name: /{camera}/set_right_color_exposure
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_right_color_gain
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_right_color_ae_roi
        type: orbbec_camera_msgs/srv/SetArrays
        mode: advertised
      - name: /{camera}/set_right_color_auto_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_color_flip
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_color_mirror
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_right_color_rotation
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/toggle_right_color
        type: std_srvs/srv/SetBool
        mode: advertised

      # Device / status / system
      - name: /{camera}/set_fan_work_mode
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/set_filter
        type: orbbec_camera_msgs/srv/SetFilter
        mode: advertised
      - name: /{camera}/set_floor_enable
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_ir_long_exposure
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_reset_timestamp
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_sports_mode
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_sync_hosttime
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/set_sync_interleaverlaser
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/export_config_json
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/set_bag_recording
        type: orbbec_camera_msgs/srv/SetBagRecording
        mode: advertised
      - name: /{camera}/set_image_registration_mode
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/set_stream_profile
        type: orbbec_camera_msgs/srv/SetStreamProfile
        mode: advertised
      - name: /{camera}/set_sync_io_voltage_level
        type: orbbec_camera_msgs/srv/SetInt32
        mode: advertised
      - name: /{camera}/switch_ir
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/toggle_color
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/toggle_depth
        type: std_srvs/srv/SetBool
        mode: advertised
      - name: /{camera}/read_customer_data
        type: orbbec_camera_msgs/srv/GetString
        mode: advertised
      - name: /{camera}/write_customer_data
        type: orbbec_camera_msgs/srv/SetString
        mode: advertised
      - name: /{camera}/get_user_calib_params
        type: orbbec_camera_msgs/srv/GetUserCalibParams
        mode: advertised
      - name: /{camera}/set_user_calib_params
        type: orbbec_camera_msgs/srv/SetUserCalibParams
        mode: advertised

      # Artifact services
      - name: /{camera}/save_images
        type: std_srvs/srv/Empty
        mode: artifact
        target_subdir: image
        min_new_files: 1
        wait_after_call: 5.0
        keepalive_topics:
          - name: /{camera}/color/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/depth/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/ir/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/left_ir/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/right_ir/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/left_color/image_raw
            type: sensor_msgs/msg/Image
          - name: /{camera}/right_color/image_raw
            type: sensor_msgs/msg/Image
      - name: /{camera}/save_point_cloud
        type: std_srvs/srv/Empty
        mode: artifact
        target_subdir: point_cloud
        min_new_files: 1
        wait_after_call: 5.0
        keepalive_topics:
          - name: /{camera}/depth/points
            type: sensor_msgs/msg/PointCloud2

      # Reboot service
      - name: /{camera}/reboot_device
        type: std_srvs/srv/Empty
        mode: reboot
