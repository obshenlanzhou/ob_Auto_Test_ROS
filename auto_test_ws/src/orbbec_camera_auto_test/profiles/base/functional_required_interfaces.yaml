      enable_depth: true
      enable_left_ir: false
      enable_right_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: false
      depth_registration: false
      align_mode: SW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_sdk_json_camera
    ros_versions: ["1"]
    launch_files:
      - gemini_330_series_sdk_json.launch
    camera_models:
      - Gemini 3
    defaults:
      device_type: camera
      publish_tf: true

rules:
  - name: camera_core
    required_topics:
      - /{camera}/device_status
      - /{camera}/depth_filters/status
    required_services:
      - /{camera}/get_device_info
      - /{camera}/get_device_config
      - /{camera}/get_sdk_version
      - /{camera}/get_point_cloud_decimation
      - /{camera}/set_point_cloud_decimation
      - /{camera}/save_images
      - /{camera}/save_point_cloud
      - /{camera}/set_bag_recording
      - /{camera}/reboot_device

  - name: ros1_sdk_version_topic
    ros_versions: ["1"]
    required_topics:
      - /{camera}/sdk_version

  - name: static_tf
    when:
      publish_tf: true
    required_topics:
      - /tf_static

  - name: color_stream
    when:
      enable_color: true
    required_topics:
      - /{camera}/color/image_raw
      - /{camera}/color/camera_info
    required_services:
      - /{camera}/get_color_exposure
      - /{camera}/set_color_exposure
      - /{camera}/get_color_gain
      - /{camera}/set_color_gain
      - /{camera}/get_auto_white_balance
      - /{camera}/set_auto_white_balance
      - /{camera}/get_white_balance
      - /{camera}/set_white_balance
      - /{camera}/set_color_auto_exposure
      - /{camera}/set_color_ae_roi
      - /{camera}/set_color_flip
      - /{camera}/set_color_mirror
      - /{camera}/set_color_rotation
      - /{camera}/toggle_color

  - name: depth_stream
    when:
      enable_depth: true
    required_topics:
      - /{camera}/depth/image_raw
      - /{camera}/depth/camera_info
    required_services:
      - /{camera}/get_depth_exposure
      - /{camera}/set_depth_exposure
      - /{camera}/get_depth_gain
      - /{camera}/set_depth_gain
      - /{camera}/set_depth_auto_exposure
      - /{camera}/set_depth_ae_roi
      - /{camera}/set_depth_flip
      - /{camera}/set_depth_mirror
      - /{camera}/set_depth_rotation
      - /{camera}/toggle_depth

  - name: ir_stream
    when:
      enable_ir: true
    required_topics:
      - /{camera}/ir/image_raw
      - /{camera}/ir/camera_info
    required_services:
      - /{camera}/get_ir_exposure
      - /{camera}/set_ir_exposure
      - /{camera}/get_ir_gain
      - /{camera}/set_ir_gain
      - /{camera}/set_ir_auto_exposure
      - /{camera}/set_ir_ae_roi
      - /{camera}/set_ir_flip
      - /{camera}/set_ir_mirror
      - /{camera}/set_ir_rotation
      - /{camera}/toggle_ir

  - name: left_ir_stream
    when:
      enable_left_ir: true
    required_topics:
      - /{camera}/left_ir/image_raw
      - /{camera}/left_ir/camera_info
    required_services:
      - /{camera}/get_left_ir_exposure
      - /{camera}/set_left_ir_exposure
      - /{camera}/get_left_ir_gain
      - /{camera}/set_left_ir_gain
      - /{camera}/set_left_ir_auto_exposure
      - /{camera}/set_left_ir_ae_roi
      - /{camera}/set_left_ir_flip
      - /{camera}/set_left_ir_mirror
      - /{camera}/set_left_ir_rotation
      - /{camera}/toggle_left_ir

  - name: right_ir_stream
    when:
      enable_right_ir: true
    required_topics:
      - /{camera}/right_ir/image_raw
      - /{camera}/right_ir/camera_info
    required_services:
      - /{camera}/get_right_ir_exposure
      - /{camera}/set_right_ir_exposure
      - /{camera}/get_right_ir_gain
      - /{camera}/set_right_ir_gain
      - /{camera}/set_right_ir_auto_exposure
      - /{camera}/set_right_ir_ae_roi
      - /{camera}/set_right_ir_flip
      - /{camera}/set_right_ir_mirror
      - /{camera}/set_right_ir_rotation
      - /{camera}/toggle_right_ir

  - name: left_color_stream
    when:
      enable_left_color: true
    required_topics:
      - /{camera}/left_color/image_raw
      - /{camera}/left_color/camera_info
    required_services:
      - /{camera}/get_left_color_exposure
      - /{camera}/set_left_color_exposure
      - /{camera}/get_left_color_gain
      - /{camera}/set_left_color_gain
      - /{camera}/set_left_color_auto_exposure
      - /{camera}/set_left_color_ae_roi
      - /{camera}/set_left_color_flip
      - /{camera}/set_left_color_mirror
      - /{camera}/set_left_color_rotation
      - /{camera}/toggle_left_color

  - name: right_color_stream
    when:
      enable_right_color: true
    required_topics:
      - /{camera}/right_color/image_raw
      - /{camera}/right_color/camera_info
    required_services:
      - /{camera}/get_right_color_exposure
      - /{camera}/set_right_color_exposure
      - /{camera}/get_right_color_gain
      - /{camera}/set_right_color_gain
      - /{camera}/set_right_color_auto_exposure
      - /{camera}/set_right_color_ae_roi
      - /{camera}/set_right_color_flip
      - /{camera}/set_right_color_mirror
      - /{camera}/set_right_color_rotation
      - /{camera}/toggle_right_color

  - name: depth_point_cloud
    when:
      enable_point_cloud: true
    required_topics:
      - /{camera}/depth/points

  - name: colored_point_cloud
    when:
      enable_colored_point_cloud: true
      enable_color: true
      enable_depth: true
    required_topics:
      - /{camera}/depth_registered/points

  - name: accel_stream
    when:
      enable_sync_output_accel_gyro: false
      enable_accel: true
    required_topics:
      - /{camera}/accel/sample
      - /{camera}/accel/imu_info

  - name: gyro_stream
    when:
      enable_sync_output_accel_gyro: false
      enable_gyro: true
    required_topics:
      - /{camera}/gyro/sample
      - /{camera}/gyro/imu_info

  - name: synchronized_imu
    when:
      enable_sync_output_accel_gyro: true
    required_topics:
      - /{camera}/gyro_accel/sample
      - /{camera}/accel/imu_info
      - /{camera}/gyro/imu_info

  - name: software_aligned_depth
    when:
      depth_registration: true
      align_mode: SW
    required_topics:
      - /{camera}/depth/image_unaligned

  - name: enhanced_depth
    when:
      enable_enhanced_depth: true
    required_topics:
      - /{camera}/confidence/image_raw

  - name: d2c_viewer
    when:
      enable_d2c_viewer: true
      enable_color: true
      enable_depth: true
    required_topics:
      - /{camera}/depth_to_color/image_raw

  - name: ros2_depth_to_color_extrinsics
    ros_versions: ["2"]
    when:
      enable_publish_extrinsic: true
      enable_color: true
      enable_depth: true
    required_topics:
      - /{camera}/depth_to_color

  - name: ros1_depth_to_color_extrinsics
    ros_versions: ["1"]
    when:
      enable_color: true
      enable_depth: true
    required_topics:
      - /{camera}/depth_to_color
