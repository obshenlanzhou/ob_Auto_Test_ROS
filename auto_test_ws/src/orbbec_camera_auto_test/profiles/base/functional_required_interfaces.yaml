# Required ROS interfaces for supported single-camera launch files.
#
# A launch profile supplies the launch defaults that affect interface creation.
# CLI/UI launch arguments override these defaults. Rules whose `when` mapping
# matches the effective arguments become mandatory: an absent interface fails
# the functional test instead of being silently removed by graph discovery.
schema_version: 1

launch_profiles:
  # ROS2: single-IR camera families with identical interface-affecting defaults.
  - name: ros2_single_ir_hw_align
    ros_versions: ["2"]
    launch_files:
      - astra2.launch.py
      - femto.launch.py
      - femto_mega.launch.py
    camera_models:
      - Astra 2
      - Femto
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: true
      depth_registration: false
      align_mode: HW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_single_ir_no_imu
    ros_versions: ["2"]
    launch_files:
      - dabai_dcw2.launch.py
      - dabai_max_pro.launch.py
    camera_models:
      - DaBai
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      depth_registration: false
      align_mode: HW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_gemini2
    ros_versions: ["2"]
    launch_files:
      - gemini2.launch.py
      - gemini210.launch.py
    camera_models:
      - Gemini 2
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: true
      depth_registration: true
      align_mode: HW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_gemini2l
    ros_versions: ["2"]
    launch_files:
      - gemini2L.launch.py
    camera_models:
      - Gemini 2L
    config_overrides:
      gemini2L_dual_ir.yaml:
        enable_ir: false
        enable_left_ir: true
        enable_right_ir: true
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: false
      depth_registration: false
      align_mode: HW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_femto_bolt
    ros_versions: ["2"]
    launch_files:
      - femto_bolt.launch.py
    camera_models:
      - Femto Bolt
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: false
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: true
      depth_registration: false
      align_mode: SW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_astra
    ros_versions: ["2"]
    launch_files:
      - astra.launch.py
    camera_models:
      - Astra
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      depth_registration: false
      align_mode: HW
      enable_publish_extrinsic: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_dual_ir_hw_align
    ros_versions: ["2"]
    launch_files:
      - dabai_a.launch.py
      - dabai_al.launch.py
      - gemini345.launch.py
      - gemini345_lg.launch.py
      - gemini435_le.launch.py
    camera_models:
      - DaBai
      - Gemini 3
      - Gemini 435Le
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_left_ir: false
      enable_right_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: false
      depth_registration: true
      align_mode: HW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros2_dual_ir_sw_align
    ros_versions: ["2"]
    launch_files:
      - gemini_301_series.launch.py
      - gemini_330_series.launch.py
      - gemini_330_series_low_cpu.launch.py
    camera_models:
      - DaBai
      - Gemini 3
      - Gemini 435Le
    config_overrides:
      gemini305_dual_color.yaml:
        enable_left_color: true
        enable_right_color: true
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_left_ir: false
      enable_right_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: false
      depth_registration: false
      align_mode: SW
      enable_publish_extrinsic: false
      enable_enhanced_depth: false
      enable_d2c_viewer: false
      publish_tf: true

  # Stream defaults are supplied by the external SDK JSON/YAML file. Core
  # interfaces remain mandatory; explicit CLI stream overrides still activate
  # the conditional rules below.
  - name: ros2_sdk_json_camera
    ros_versions: ["2"]
    launch_files:
      - gemini_330_series_sdk_json.launch.py
    camera_models:
      - Gemini 3
    defaults:
      device_type: camera
      publish_tf: true

  # ROS1 profiles.
  - name: ros1_single_ir_no_imu
    ros_versions: ["1"]
    launch_files:
      - dabai_dcw2.launch
      - dabai_max_pro.launch
    camera_models:
      - DaBai
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      depth_registration: false
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_single_ir_imu
    ros_versions: ["1"]
    launch_files:
      - femto.launch
      - femto_mega.launch
      - gemini2.launch
      - gemini210.launch
      - gemini2L.launch
    camera_models:
      - Femto
      - Gemini 2
    config_overrides:
      gemini2L_dual_ir.yaml:
        enable_ir: false
        enable_left_ir: true
        enable_right_ir: true
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: true
      enable_gyro: true
      enable_sync_output_accel_gyro: true
      depth_registration: false
      align_mode: HW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_femto_bolt
    ros_versions: ["1"]
    launch_files:
      - femto_bolt.launch
    camera_models:
      - Femto Bolt
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: true
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: true
      enable_gyro: true
      enable_sync_output_accel_gyro: true
      depth_registration: false
      align_mode: SW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_astra
    ros_versions: ["1"]
    launch_files:
      - astra.launch
    camera_models:
      - Astra
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: true
      depth_registration: false
      align_mode: SW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_astra2
    ros_versions: ["1"]
    launch_files:
      - astra2.launch
    camera_models:
      - Astra 2
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: true
      enable_gyro: true
      enable_sync_output_accel_gyro: true
      depth_registration: false
      align_mode: HW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_dual_ir_hw_align
    ros_versions: ["1"]
    launch_files:
      - dabai_a.launch
      - dabai_al.launch
      - gemini345.launch
      - gemini345_lg.launch
      - gemini435_le.launch
    camera_models:
      - DaBai
      - Gemini 3
      - Gemini 435Le
    defaults:
      device_type: camera
      enable_color: true
      enable_depth: true
      enable_left_ir: false
      enable_right_ir: false
      enable_point_cloud: true
      enable_colored_point_cloud: false
      enable_accel: false
      enable_gyro: false
      enable_sync_output_accel_gyro: false
      depth_registration: true
      align_mode: HW
      enable_d2c_viewer: false
      publish_tf: true

  - name: ros1_dual_ir_sw_align
    ros_versions: ["1"]
    launch_files:
      - gemini_301_series.launch
      - gemini_330_series.launch
      - gemini_330_series_low_cpu.launch
      - gemini_330_series_nodelet.launch
      - gemini_330_series_nodelet_low_cpu.launch
      - ob_camera.launch
      - ob_camera_gdb.launch
    camera_models:
      - DaBai
      - Gemini 3
      - Gemini 435Le
    config_overrides:
      gemini305_dual_color.yaml:
        enable_left_color: true
